repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        stages: [commit]
        language: system
        entry: isort
        types: [python]
        args: ["--profile", "black"]
      - id: black
        name: black
        stages: [commit]
        language: system
        entry: black
        types: [python]
        args: ["--experimental-string-processing"]
      - id: yamllint
        name: yamllint
        stages: [commit]
        language: system
        entry: yamllint
        types: [yaml]
        args: ["-d", "{extends: relaxed, rules: {line-length: disable}}"]
